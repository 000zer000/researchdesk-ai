[project]
name = "researchdesk-ai"
version = "1.2.0"
description = "Evidence-first local financial research with deterministic valuation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "lxml>=5.3,<7",
  "numpy>=2.2,<3", "onnxruntime>=1.21,<2", "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<1", "reportlab>=4.3,<5",
]
[project.optional-dependencies]
local = ["mlx-lm>=0.22,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "pypdf>=5.4,<7", "pymupdf>=1.25,<2"]
[project.scripts]
researchdesk = "researchdesk.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/researchdesk"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL database", "live: requires a real local LLM"]
