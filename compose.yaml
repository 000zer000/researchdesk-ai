services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: researchdesk
      POSTGRES_PASSWORD: researchdesk
      POSTGRES_DB: researchdesk
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchdesk -d researchdesk"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://researchdesk:researchdesk@db:5432/researchdesk
      LLM_BACKEND: local-http
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      LOCAL_LLM_URL: http://host.docker.internal:8081/v1/chat/completions
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./data/cache:/app/data/cache", "./data/models:/app/data/models", "./data/runtime:/app/data/runtime"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn researchdesk.api:app --host 0.0.0.0 --port 8000"]
volumes:
  pgdata:
